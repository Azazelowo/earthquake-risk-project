# 每次 push 到 main 或開 PR 時，跑 pipeline/tests 的單元測試。
# 測試只用合成資料與假的 HTTP，不需要本機原始資料，也不會連到 USGS。
#
# 注意：claude/b3-baseline-model-6e563a 分支的 risk-assessment.yml 也有一個
# 跑同樣測試的 tests job。兩個分支都合併進 main 後，刪掉其中一個，避免重複執行。
name: pipeline-tests

on:
  push:
    branches: [ main ]
    paths:
      - "pipeline/**"
      - "requirements.txt"
      - ".github/workflows/pipeline-tests.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "pipeline/**"
      - "requirements.txt"
      - ".github/workflows/pipeline-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          # 與 requirements.txt 註明的測試版本一致
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (synthetic data, no network)
        run: python -m unittest discover -s pipeline/tests -v
